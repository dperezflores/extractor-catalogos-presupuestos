# Copia este archivo como .streamlit/secrets.toml para desarrollo local.
# Nunca publiques secrets.toml en GitHub.

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "CAMBIAR_POR_UN_SECRETO_LARGO_Y_ALEATORIO"
client_id = "TU_CLIENT_ID.apps.googleusercontent.com"
client_secret = "TU_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
allowed_emails = ["usuario1@gmail.com", "usuario2@gmail.com"]

[application]
auth_required = true
model = "gpt-5.6-luna"
reasoning_effort = "low"
pdf_detail = "high"
chunk_size = 4
chunk_overlap = 1
match_threshold = 86

[database]
# Desarrollo local:
url = "sqlite:///data/checkpoints.db"
# Producción (ejemplo):
# url = "postgresql+psycopg://usuario:password@host:5432/base"
